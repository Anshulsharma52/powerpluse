<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e2640" />
    </linearGradient>
    
    <!-- Neon Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    
    <!-- Neon Plus Gradient -->
    <linearGradient id="plusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1" />

  <!-- Charging Ring / Power Loop -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="110 40" transform="rotate(-90 32 32)" />

  <!-- Centered Lightning Bolt with neon glow -->
  <path d="M38 12 L20 34 H31 L26 52 L44 30 H33 Z" fill="url(#boltGrad)" filter="url(#neonGlow)" />

  <!-- Stylized Plus Badge at top right -->
  <g transform="translate(46, 8)" filter="url(#neonGlow)">
    <circle cx="4" cy="4" r="7" fill="#0b0f19" stroke="url(#plusGrad)" stroke-width="1.8" />
    <path d="M4 1.5 v5 M1.5 4 h5" stroke="url(#plusGrad)" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
